<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JANコード読取テスト</title><style>body{font-family:system-ui,sans-serif;margin:20px auto;padding:0 14px;max-width:600px;color:#222}h2{font-size:1.35rem}button,input{font-size:18px;padding:12px;border-radius:8px}button{background:#166534;color:white;border:0;margin:5px 5px 5px 0}button:disabled{opacity:.4}input{width:95%;box-sizing:border-box;border:1px solid #aaa}video{width:100%;max-height:320px;background:#222;border-radius:8px}#result{padding:16px;background:#eef7ef;border-radius:8px;min-height:70px;margin-top:14px}.note{color:#555;font-size:14px}#status{font-size:14px;color:#555}</style></head><body><h2>JANコード カメラ読取テスト</h2><p>こんにゃく商品マスタ（8商品）</p><button id="start">📷 カメラ起動</button><button id="read" disabled style="background:#166534">◎ JAN読取</button><button id="stop" style="background:#555">停止</button><video id="video" playsinline muted></video><p id="status">カメラ起動にはHTTPS（GitHub Pagesなど）とカメラ許可が必要です。対応ブラウザではBarcodeDetectorを使用します。</p><label for="jan">JANコード（手入力でも検索可能）</label><input id="jan" inputmode="numeric" placeholder="JANコードを入力"><button id="search">商品を検索</button><div id="result">JANコードを読み取ると商品情報を表示します。</div><p class="note">※ 今回はJAN-13のみ。マスタは画面画像から転記したテスト用データです。<br>※ 商品画像・発注機能・LINE送信は含みません。</p><script>
const items=[['4582142470010','角こんにゃく','220g'],['4582142470119','糸こんにゃく 白','170g'],['4582142470126','糸こんにゃく 黒','170g'],['4582142470096','特大こんにゃく','400g'],['4582142470195','徳用糸こんにゃく 白','300g'],['4582142470201','徳用糸こんにゃく 黒','300g'],['4582142470034','田舎こんにゃく','330g'],['4582142470041','唐辛子入り田舎こんにゃく','330g']];
const $=id=>document.getElementById(id);
let stream=null,detector=null,reading=false;
function check(s){if(!/^\d{13}$/.test(s))return false;let sum=0;for(let i=0;i<12;i++)sum+=Number(s[i])*(i%2?3:1);return (10-sum%10)%10===Number(s[12])}
function search(){let s=$('jan').value.trim().replace(/\D/g,'');$('jan').value=s;let x=items.find(i=>i[0]===s);$('result').innerHTML=x?'<strong>商品が見つかりました</strong><p>JAN：'+x[0]+'</p><p>商品名：'+x[1]+'</p><p>規格：'+x[2]+'</p>':s?('該当商品がありません。'+(check(s)?'（JAN-13のチェックデジットは正常）':'（JAN-13の桁数またはチェックデジットを確認してください）')):'JANを入力してください';}
function stop(){reading=false;$('read').disabled=true;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('status').textContent='カメラを停止しました。';}
async function start(){if(stream){$('status').textContent='カメラは起動中です。JANに位置を合わせて「JAN読取」を押してください。';return}if(!('BarcodeDetector'in window)){$('status').textContent='このブラウザはBarcodeDetectorに対応していません。';return}try{detector=new BarcodeDetector({formats:['ean_13']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('video').srcObject=stream;await $('video').play();$('read').disabled=false;$('status').textContent='カメラ映像を確認し、目的のJANに合わせてから「JAN読取」を押してください。';}catch(e){stop();$('status').textContent='カメラを起動できません：'+e.message;}}
async function read(){if(!stream||reading)return;reading=true;$('read').disabled=true;$('status').textContent='JANコードを読み取っています…';try{let codes=await detector.detect($('video'));let match=codes.find(c=>/^\d{13}$/.test(c.rawValue)&&check(c.rawValue));if(match){$('jan').value=match.rawValue;search();$('status').textContent='読取成功：'+match.rawValue+'（次の商品は位置を合わせて「JAN読取」を押してください）';}else{$('status').textContent='JANを検出できませんでした。位置を合わせて、もう一度「JAN読取」を押してください。';}}catch(e){$('status').textContent='読取エラー：'+e.message;}finally{reading=false;$('read').disabled=!stream;}}
$('start').onclick=start;$('read').onclick=read;$('stop').onclick=stop;$('search').onclick=search;$('jan').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script></body></html>
